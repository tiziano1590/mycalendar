[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mycalendar"
version = "0.1.0"
description = "A simple Python package that prints the calendar and highlights the current day"
readme = "README.md"
requires-python = ">=3.8"
dependencies = []

[project.scripts]
mycalendar = "mycalendar.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
include = ["*.md"]
